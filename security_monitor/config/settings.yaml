# ================================================================
#  settings.yaml  –  Edit this file to customise your monitor
#
#  ⚠️  NEVER put a real password or bot token in this file and commit it.
#      Use environment variables instead (they win over this file):
#          export SMTP_PASSWORD='xxxx xxxx xxxx xxxx'
#          export TELEGRAM_BOT_TOKEN='123456:ABC...'
#          export TELEGRAM_CHAT_ID='123456789'
# ================================================================

# How often (in seconds) to check for new log entries
check_interval_seconds: 10

# Where alert records are written as JSON lines (always on, even when
# email/Telegram are switched off). Relative paths are relative to the
# security_monitor folder.
alerts_dir: logs


# ── Linux Settings ───────────────────────────────────────────
linux:
  # Path to the authentication log file
  # Ubuntu/Debian: /var/log/auth.log
  # CentOS/RHEL:   /var/log/secure
  # Demo/testing:  logs/test_auth.log
  log_file: /var/log/auth.log


# ── Windows Settings ─────────────────────────────────────────
windows:
  log_name: Security


# ── Threshold Rules (what counts as an attack?) ─────────────
thresholds:
  # BRUTE-FORCE RULE:
  # If the same IP address fails to log in X times (or more)
  # within Y seconds → trigger an alert
  failed_login_count: 5             # number of failures
  failed_login_window_seconds: 180  # within 3 minutes

  # After an alert, stay quiet about that same IP for this long so one
  # long attack does not fill your inbox with identical emails.
  alert_cooldown_seconds: 300


# ── Email Alert Settings ─────────────────────────────────────
email:
  enabled: false            # set to true once sender_password is real
  smtp_server: smtp.gmail.com
  smtp_port: 587
  sender_email: YOUR_EMAIL@gmail.com
  sender_password: YOUR_APP_PASSWORD    # ← Gmail App Password (or SMTP_PASSWORD)
  recipient_email: YOUR_EMAIL@gmail.com # ← who gets the alert


# ── Telegram Alert Settings ──────────────────────────────────
telegram:
  enabled: false            # set to true once bot_token and chat_id are real
  bot_token: "YOUR_BOT_TOKEN"   # ← from @BotFather (or TELEGRAM_BOT_TOKEN)
  chat_id:   "YOUR_CHAT_ID"     # ← your Telegram chat ID (or TELEGRAM_CHAT_ID)
